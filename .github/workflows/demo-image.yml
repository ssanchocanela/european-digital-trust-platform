# Builds the platform image and publishes it to GitHub Container Registry, for the demonstration VM
# (ADR 0010). One image, several entry points: API, console, start page, hosted form, bank, gateway.
#
# The image carries no secret — configuration is read from the environment at run time — and the code
# is public, so the package is public too: the VM pulls it without holding a GitHub credential.
# Publishing an image is not deploying it: `deploy-demo` does that, and only when the user confirms.
name: demo-image

on:
  push:
    branches: [main, "implementation/**"]
    paths: ["implementation/**", ".github/workflows/demo-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/edtp-platform"
          branch="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          echo "list=${image}:${GITHUB_SHA::12},${image}:${branch}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: implementation
          file: implementation/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=EDTP V0 platform (TEST only, synthetic data)
          cache-from: type=gha
          cache-to: type=gha,mode=max
