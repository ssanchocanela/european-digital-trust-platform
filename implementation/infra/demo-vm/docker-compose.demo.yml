# Demonstration VM override (ADR 0010), used as:
#
#   docker compose -f docker-compose.yml -f infra/demo-vm/docker-compose.demo.yml up -d
#
# - Every platform process runs the published image (`EDTP_IMAGE`, from the `demo-image` workflow)
#   instead of building on the VM.
# - The filtering gateway, a host process in laptop sessions, is a container here, with the same code
#   and the same allow-list. The pinned-wallet compatibility switch is on (A29), as ADR 0010 decides.
# - Every port binds to 127.0.0.1 only. `cloudflared` on the same host is the only way in, and the
#   Hetzner firewall has no inbound rules.
# - Everything restarts unless stopped: this environment is always on.

x-platform-image: &platform-image
  image: ${EDTP_IMAGE:?set EDTP_IMAGE to ghcr.io/<owner>/edtp-platform:<tag>}
  build: !reset null
  restart: unless-stopped

services:
  platform-api:
    <<: *platform-image

  operator-console:
    <<: *platform-image

  test-start:
    <<: *platform-image
    ports: !override
      - "127.0.0.1:3201:3201"

  pid-form:
    <<: *platform-image
    environment:
      # A client's look only on the Access-protected host (ADR 0010 §2); anywhere else, neutral.
      HOSTED_FORM_BRANDED_HOST: edtp-cliente.murcata.es

  demo-bank:
    <<: *platform-image

  demo-onboarding:
    <<: *platform-image

  # Banco Horizonte again, wearing a client's look (apps/demo-onboarding/src/brand.ts), for a
  # demonstration prepared for that client with its written permission. Only behind Cloudflare Access,
  # on edtp-banco-cliente.murcata.es, and off until COMPOSE_PROFILES names it: without its brand
  # directory it would refuse to start. Its own policies, because the platform returns a same-device
  # wallet to one origin per policy (`register-bank-onboarding.mjs … --variant client`). The brand
  # directory holds the client's logo: on the host only, never in git.
  demo-onboarding-client:
    <<: *platform-image
    profiles: ["client-brand"]
    command: ["node", "apps/demo-onboarding/dist/main.js"]
    environment:
      NODE_ENV: production
      ONBOARDING_PORT: "3206"
      PLATFORM_API_BASE_URL: http://platform-api:3100
      HOSTED_VERIFIER_SECRET: ${HOSTED_VERIFIER_SECRET:-}
      ONBOARDING_POLICY: ${ONBOARDING_CLIENT_POLICY:-}
      ONBOARDING_LOGIN_POLICY: ${ONBOARDING_CLIENT_LOGIN_POLICY:-}
      ONBOARDING_BRAND_DIR: /brand
      # On: Access protects this whole hostname, /backoffice included (a 302 to Access was seen from
      # outside on 21 November 2026), so the identity header the back office trusts can only come
      # from Access. Its cases are this instance's own.
      ONBOARDING_BACKOFFICE: "on"
    volumes:
      - /var/lib/edtp-brands/bank-client:/brand:ro
    ports:
      - "127.0.0.1:3206:3206"

  demo-portal:
    <<: *platform-image
    environment:
      PORTAL_STATUS_FILE: /status/checks.json
      # true once the age verification demos are deployed (ADR 0011); the VM's .env sets it.
      PORTAL_SHOW_AV_DEMOS: ${PORTAL_SHOW_AV_DEMOS:-false}
      # true once Banco Horizonte is registered and its hostname routed (ADR 0012).
      PORTAL_SHOW_ONBOARDING: ${PORTAL_SHOW_ONBOARDING:-false}
      PORTAL_SHOW_INCOME: ${PORTAL_SHOW_INCOME:-false}
      PORTAL_PROFILE_DIR: /profile-requests
    volumes:
      # The scheduled negative checks' last result, read-only (infra/demo-vm/scheduled-checks.sh).
      - /var/lib/edtp-status:/status:ro
      # Branding-profile requests: the portal writes request.json, the host applies it
      # (apply-profile-request.sh). The only writable path the portal has.
      - /var/lib/edtp-profile-requests:/profile-requests

  gateway:
    <<: *platform-image
    command: ["node", "apps/test-gateway/dist/main.js"]
    depends_on: [eudiplo, platform-api]
    environment:
      NODE_ENV: production
      GATEWAY_BIND_HOST: 0.0.0.0
      GATEWAY_ENGINE_PORT: "3010"
      GATEWAY_PLATFORM_PORT: "3011"
      GATEWAY_ENGINE_TARGET: http://eudiplo:3000
      GATEWAY_PLATFORM_TARGET: http://platform-api:3100
      GATEWAY_PINNED_WALLET_COMPAT: "true"
      GATEWAY_ATTESTATION_SKEW_DELAY_MS: "3000"
      GATEWAY_HOSTED_FORM_URL: ${HOSTED_FORM_PUBLIC_URL:?}/
      GATEWAY_HOSTED_FORM_AUTHORIZE_SECRET: ${HOSTED_FORM_AUTHORIZE_SECRET:?}
      GATEWAY_HOSTED_FORM_TENANTS: ${EDTP_FORM_TENANTS:-pid-1,rpi-1,fam-1}
    ports:
      - "127.0.0.1:3010:3010"
      - "127.0.0.1:3011:3011"
