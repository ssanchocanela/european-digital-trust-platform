# The age verification issuer on the demonstration VM (ADR 0012): age_verification_platform's issuer
# stack -- haproxy, Keycloak (the mock eID), the issuer, the status list and the wallet provider -- as a
# compose project of its own, `av-issuer`, published at issuer-dev.murcata.es as it was from the laptop.
#
#   docker compose -p av-issuer -f infra/demo-vm/av-issuer/docker-compose.yml --env-file ~/.av/issuer.env up -d
#
# - Images come from that repository's demo-images workflow, pinned by commit (AV_ISSUER_IMAGE_TAG),
#   with their configuration built in: the repository is private and the VM cannot clone it.
# - Service names are the laptop stack's, because haproxy's routing names them.
# - Only haproxy has a port, on loopback. cloudflared publishes issuer-dev.murcata.es through it, for the
#   paths a wallet uses (files/cloudflared-config.yml); haproxy refuses Keycloak's admin console and master
#   realm to anything but localhost as well.
# - The signing keys (issuer.p12, wallet-provider.p12) are the laptop's TEST keys, in ~/.av/issuer-pki,
#   copied by setup-issuer.sh; so attestations issued from the laptop stay valid. Never committed.

name: av-issuer

services:
  postgres:
    image: ghcr.io/ssanchocanela/av-issuer-db:${AV_ISSUER_IMAGE_TAG:?set AV_ISSUER_IMAGE_TAG to a 12-hex demo-images tag}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: pid_issuer
      POSTGRES_USER: pid_issuer
      POSTGRES_PASSWORD: pid_issuer
    volumes:
      # /var/lib/postgresql, not its data subdirectory: postgres 18 refuses the old path.
      - issuer-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pid_issuer -d pid_issuer"]
      interval: 5s
      timeout: 5s
      retries: 10

  wallet-provider-db:
    image: ghcr.io/ssanchocanela/av-issuer-db:${AV_ISSUER_IMAGE_TAG:?}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: wallet_provider
      POSTGRES_USER: wallet_provider
      POSTGRES_PASSWORD: wallet_provider
    volumes:
      - wallet-provider-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_provider -d wallet_provider"]
      interval: 5s
      timeout: 5s
      retries: 10

  status-list:
    image: ghcr.io/ssanchocanela/av-issuer-status-list:${AV_ISSUER_IMAGE_TAG:?}
    restart: unless-stopped
    mem_limit: 192m
    environment:
      API_key: aaa-bbb-ccc
      AV_STATUS_LIST_PUBLIC_BASE: ${AV_ISSUER_PUBLIC_BASE:-https://issuer-dev.murcata.es}/
    volumes:
      # The lists every issued attestation and client status points at: they must outlive a deployment.
      - status-lists:/var/opt/status_lists
      - status-lists-backups:/var/opt/status_list_backup

  keycloak:
    image: ghcr.io/ssanchocanela/av-issuer-keycloak:${AV_ISSUER_IMAGE_TAG:?}
    restart: unless-stopped
    mem_limit: 1280m
    command: ["start-dev", "--import-realm", "--features=dpop,passkeys"]
    environment:
      KC_PROXY_HEADERS: forwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: ${AV_ISSUER_PUBLIC_BASE:-https://issuer-dev.murcata.es}/idp
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTPS_CERTIFICATE_FILE: /etc/ssl/certs/keycloak.tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/ssl/certs/keycloak.tls.key
      # Random, from ~/.av/issuer.env, never Keycloak's default. It takes effect when the database is
      # created; afterwards it is the admin's stored password.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?}
    volumes:
      # start-dev keeps everything in H2 under data/h2. On the laptop it lived in the container and was
      # lost on every recreation; here it is a volume, and keycloak-config reapplies the configuration anyway.
      - keycloak-data:/opt/keycloak/data/h2
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /idp/health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # One shot after every `up`: configure-keycloak.sh, idempotent, straight at Keycloak on the project
  # network -- not through haproxy, which refuses the admin API to anything but localhost.
  keycloak-config:
    image: ghcr.io/ssanchocanela/av-issuer-tools:${AV_ISSUER_IMAGE_TAG:?}
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_BASE: http://keycloak:8080/idp
      KC_ADMIN_USER: admin
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?}

  pid-issuer:
    image: ghcr.io/ssanchocanela/av-issuer:${AV_ISSUER_IMAGE_TAG:?}
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      status-list:
        condition: service_started
    environment:
      # The laptop stack's environment (upstream's compose and deploy/issuer-local/compose.av.yml), with
      # its passwords and public base from ~/.av/issuer.env.
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=64M
      SPRING_PROFILES_ACTIVE: av,av-stack
      SPRING_WEBFLUX_BASE_PATH: /pid-issuer
      SERVER_PORT: "8080"
      SPRING_HTTP_CODECS_MAXINMEMORYSIZE: 8MB
      # The realm's own client for token introspection: upstream's value, in its public realm file.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTID: pid-issuer-srv
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTSECRET: zIKAV9DIIIaJCzHCVBPlySgU8KgY68U2
      AV_ISSUER_PUBLIC_BASE: ${AV_ISSUER_PUBLIC_BASE:-https://issuer-dev.murcata.es}
      ISSUER_PUBLICURL: ${AV_ISSUER_PUBLIC_BASE:-https://issuer-dev.murcata.es}/pid-issuer
      ISSUER_AUTHORIZATIONSERVER_PUBLICURL: ${AV_ISSUER_PUBLIC_BASE:-https://issuer-dev.murcata.es}/idp/realms/pid-issuer-realm
      ISSUER_AUTHORIZATIONSERVER_INTROSPECTION: http://keycloak:8080/idp/realms/pid-issuer-realm/protocol/openid-connect/token/introspect
      ISSUER_KEYSTORE_FILE: file:/pki/issuer.p12
      ISSUER_KEYSTORE_TYPE: PKCS12
      ISSUER_KEYSTORE_PASSWORD: ${AV_PKI_PASSWORD:?}
      AV_PKI_PASSWORD: ${AV_PKI_PASSWORD:?}
      ISSUER_ACCESSCERTIFICATE_ALIAS: access-certificate
      ISSUER_ACCESSCERTIFICATE_PASSWORD: ${AV_PKI_PASSWORD:?}
      ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_ALIAS: request-encryption
      ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_PASSWORD: ${AV_PKI_PASSWORD:?}
      ISSUER_NONCE_ENCRYPTIONKEY_ALIAS: nonce-encryption
      ISSUER_NONCE_ENCRYPTIONKEY_PASSWORD: ${AV_PKI_PASSWORD:?}
      ISSUER_PID_MSO_MDOC_SIGNING_KEY_ALIAS: issuance
      ISSUER_PID_MSO_MDOC_SIGNING_KEY_PASSWORD: issuance
      ISSUER_PID_SD_JWT_VC_SIGNING_KEY_ALIAS: issuance
      ISSUER_PID_SD_JWT_VC_SIGNING_KEY_PASSWORD: issuance
      ISSUER_MDL_SIGNING_KEY_ALIAS: issuance
      ISSUER_MDL_SIGNING_KEY_PASSWORD: issuance
      ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_ALIAS: issuance
      ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_PASSWORD: issuance
      ISSUER_DPOP_REALM: pid-issuer
      # The issuer manages the realm's users through Keycloak's admin API, with the random admin.
      ISSUER_KEYCLOAK_SERVER_URL: http://keycloak:8080/idp
      ISSUER_KEYCLOAK_AUTHENTICATION_REALM: master
      ISSUER_KEYCLOAK_CLIENT_ID: admin-cli
      ISSUER_KEYCLOAK_USERNAME: admin
      ISSUER_KEYCLOAK_PASSWORD: ${KC_ADMIN_PASSWORD:?}
      ISSUER_KEYCLOAK_USER_REALM: pid-issuer-realm
      SPRING_R2DBC_URL: r2dbc:pool:postgresql://pid_issuer:pid_issuer@postgres:5432/pid_issuer
      SPRING_R2DBC_USERNAME: pid_issuer
      SPRING_R2DBC_PASSWORD: pid_issuer
      ISSUER_STATUSLIST_SERVICE_GENERATEURI: http://status-list:5000/token_status_list/take
      ISSUER_STATUSLIST_SERVICE_GENERATE_URI: http://status-list:5000/token_status_list/take
      ISSUER_STATUSLIST_SERVICE_REVOKEURI: http://status-list:5000/token_status_list/set
      ISSUER_STATUSLIST_SERVICE_REVOKE_URI: http://status-list:5000/token_status_list/take
      ISSUER_STATUSLIST_SERVICE_APIKEY: aaa-bbb-ccc
      ISSUER_METADATA_DISPLAY_0_NAME: Digital Credentials Issuer
      ISSUER_METADATA_DISPLAY_0_LOCALE: en
      ISSUER_METADATA_DISPLAY_0_LOGO_URI: https://eudiw.dev/ic-logo.svg
      ISSUER_METADATA_DISPLAY_0_LOGO_ALTERNATIVE_TEXT: EU Digital Identity Wallet Logo
      # Our own wallet provider beside it (that repository's ADR-0021): its public URL as `iss`, its keys
      # read on the project network.
      AV_WALLET_PROVIDER: ${AV_ISSUER_PUBLIC_BASE:-https://issuer-dev.murcata.es}/wallet-provider
      AV_WALLET_PROVIDER_JWKS: http://wallet-provider:8080/jwks
      AV_WALLET_PROVIDER_ASSURANCE: dev
      # Off: the counter path's offer API and pre-authorized token endpoint are not registered.
      AV_OFFER_API_KEY: ""
      # A self-signed TEST registration certificate for eu.europa.ec.av.1; without one the issuer refuses
      # to start (that repository's ADR-0022).
      ISSUER_WRPRC: ${AV_WRPRC:?}
      AV_WRPRC: ${AV_WRPRC:?}
    volumes:
      - ${HOME}/.av/issuer-pki:/pki:ro

  wallet-provider:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-wallet-provider:v0.2.1
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      wallet-provider-db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      ISSUER_PUBLICURL: ${AV_ISSUER_PUBLIC_BASE:-https://issuer-dev.murcata.es}/wallet-provider
      ISSUER_NAME: AV Test Wallet Provider
      CLIENTID: ageverification-abca
      SIGNINGKEY_KEYSTOREFILE: /pki/wallet-provider.p12
      SIGNINGKEY_KEYSTORETYPE: PKCS12
      SIGNINGKEY_KEYSTOREPASSWORD: ${AV_PKI_PASSWORD:?}
      SIGNINGKEY_KEYALIAS: wallet-provider
      SIGNINGKEY_KEYPASSWORD: ${AV_PKI_PASSWORD:?}
      SIGNINGKEY_ALGORITHM: ES256
      DATABASE_URL: r2dbc:pool:postgresql://wallet-provider-db:5432/wallet_provider
      DATABASE_USERNAME: wallet_provider
      DATABASE_PASSWORD: wallet_provider
      TOKENSTATUSLISTSERVICE_SERVICEURL: http://status-list:5000/token_status_list/take
      TOKENSTATUSLISTSERVICE_APIKEY: aaa-bbb-ccc
      TOKENSTATUSLISTSERVICE_COUNTRY: FC
      TOKENSTATUSLISTSERVICE_WALLETINSTANCEATTESTATIONSTATUSLIST: oauth-client-attestation+jwt
      TOKENSTATUSLISTSERVICE_KEYATTESTATIONSTATUSLIST: key-attestation+jwt
      WALLETINSTANCEATTESTATION_WALLETNAME: AV Demo Wallet (TEST)
      WALLETINSTANCEATTESTATION_WALLETVERSION: dev
      WALLETINSTANCEATTESTATION_WALLETSOLUTIONCERTIFICATIONINFORMATION: none (test wallet provider)
      KEYATTESTATION_CERTIFICATION: https://murcata.es/av/test-wallet-provider/no-certification
      WALLETINSTANCEATTESTATION_CLIENTSTATUSVALIDITY: 120 days
      KEYATTESTATION_KEYSTORAGESTATUSVALIDITY: 120 days
    volumes:
      - ${HOME}/.av/issuer-pki:/pki:ro

  haproxy:
    image: ghcr.io/ssanchocanela/av-issuer-haproxy:${AV_ISSUER_IMAGE_TAG:?}
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      keycloak:
        condition: service_healthy
      pid-issuer:
        condition: service_started
    ports:
      # Loopback only; cloudflared reaches it over TLS, as the laptop tunnel did.
      - "127.0.0.1:3220:443"

volumes:
  issuer-db:
  wallet-provider-db:
  status-lists:
  status-lists-backups:
  keycloak-data:
