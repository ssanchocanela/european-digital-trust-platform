# /etc/cloudflared/config.yml on the demonstration VM (ADR 0010). The credential file sits beside it,
# root-only, and is never committed. Default-deny: anything unmatched is a 404 at the edge.
#
# The engine and the platform are reached THROUGH the filtering gateway (3010, 3011), never directly:
# its allow-list is what keeps the Management API off the internet (CLAUDE.md §6.20). The operator
# console (3200) is not here at all.
tunnel: b7f28b3b-a6e0-453f-8e12-7882008dcf63
credentials-file: /etc/cloudflared/b7f28b3b-a6e0-453f-8e12-7882008dcf63.json
ingress:
  - hostname: edtp-ssh.murcata.es
    service: ssh://localhost:22
  - hostname: edtp-engine.murcata.es
    service: http://127.0.0.1:3010
  - hostname: edtp-platform.murcata.es
    service: http://127.0.0.1:3011
  - hostname: edtp-start.murcata.es
    service: http://127.0.0.1:3201
  - hostname: edtp-pid.murcata.es
    service: http://127.0.0.1:3202
  - hostname: edtp-banco.murcata.es
    service: http://127.0.0.1:3203
  # The hosted form again, on the one hostname a client's look may appear on. It is behind Cloudflare
  # Access (application "EDTP demo cliente"), and it was added only after Access was seen protecting
  # it (ADR 0010 §2).
  - hostname: edtp-cliente.murcata.es
    service: http://127.0.0.1:3202
  # The demonstration portal. Public, except /operador, which the Access application "EDTP demo
  # operador" protects at the edge (the portal also refuses it without Access's identity header).
  - hostname: demo.murcata.es
    service: http://127.0.0.1:3204
  # The age verification demos (ADR 0011), a compose project of their own. Lumen and Plaza are public
  # whole: their pages are built to be, and their presenter controls are off.
  - hostname: av-lumen.murcata.es
    service: http://127.0.0.1:3211
  - hostname: av-plaza.murcata.es
    service: http://127.0.0.1:3212
  # Of the verifier, only what a wallet calls: the request object, its public keys, and the direct_post
  # answer. /v1/sessions (the demos reach it on the project's own network), /ui/presentations (which
  # opens transactions without authentication), /utilities, the JWKS, Swagger and the actuator stay
  # unpublished: the rule after these answers 404 for anything else on the hostname.
  - hostname: av-verifier.murcata.es
    path: ^/wallet/(request\.jwt|direct_post)/[^/]+$
    service: http://127.0.0.1:3210
  - hostname: av-verifier.murcata.es
    path: ^/wallet/public-keys\.json$
    service: http://127.0.0.1:3210
  - hostname: av-verifier.murcata.es
    service: http_status:404
  # The age verification issuer (ADR 0012), through its haproxy over TLS, as the laptop tunnel reached it.
  # Only what a wallet and a browser use: the issuer's realm (login, PAR, tokens, keys) and the login
  # page's resources, the issuer and its well-known documents, the status lists and the wallet provider.
  # Keycloak's admin console and API and the master realm match nothing here and answer 404; haproxy
  # refuses them to anything but localhost as well.
  # The counter path's internal API (offers and the pre-authorized token endpoint's back office) is off on
  # the VM, and never public even if it were turned on. A rule of its own, before the allow-list, because
  # the allow-list admits everything under /pid-issuer/ and cloudflared's regexps have no negation.
  - hostname: issuer-dev.murcata.es
    path: ^/pid-issuer/av/internal/
    service: http_status:404
  - hostname: issuer-dev.murcata.es
    path: ^/(idp/realms/pid-issuer-realm/|idp/resources/|pid-issuer(/|$)|token_status_list/|wallet-provider/|\.well-known/(openid-credential-issuer|oauth-authorization-server|openid-configuration|oauth-protected-resource|jwt-vc-issuer|jwt-issuer)/)
    service: https://127.0.0.1:3220
    originRequest:
      noTLSVerify: true
      httpHostHeader: issuer-dev.murcata.es
  - hostname: issuer-dev.murcata.es
    service: http_status:404
  - service: http_status:404
